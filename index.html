<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>形状变换艺术</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000000;
    }

    .info {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="info">点击屏幕切换形状 · 心 → 裴字 → 摩羯座 → 心</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let w, h, dpr;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    resize();
    window.addEventListener('resize', resize, { passive: true });

    // ==================== 形状定义 ====================
    
    // 心形
    function getHeartShape(scale = 1) {
      const points = [];
      for (let t = 0; t < Math.PI * 2; t += Math.PI * 2 / 200) {
        const x = 16 * Math.pow(Math.sin(t), 3) * scale;
        const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
        points.push({ x, y });
      }
      return points;
    }

    // 裴字形状（简化中文字"裴"的轮廓）
    function getPeiShape(scale = 1) {
      const points = [];
      // 这是一个近似的裴字形状
      const peiOutline = [
        // 左竖
        { x: -8, y: -12 }, { x: -5, y: -12 }, { x: -5, y: 12 }, { x: -8, y: 12 },
        // 右竖
        { x: 8, y: -12 }, { x: 5, y: -12 }, { x: 5, y: 12 }, { x: 8, y: 12 },
        // 上横
        { x: -8, y: -10 }, { x: 8, y: -10 }, { x: 8, y: -7 }, { x: -8, y: -7 },
        // 中横
        { x: -6, y: -2 }, { x: 6, y: -2 }, { x: 6, y: 1 }, { x: -6, y: 1 },
        // 下横
        { x: -8, y: 6 }, { x: 8, y: 6 }, { x: 8, y: 9 }, { x: -8, y: 9 },
      ];
      
      for (let t = 0; t < Math.PI * 2; t += Math.PI * 2 / 200) {
        const idx = Math.floor((t / (Math.PI * 2)) * peiOutline.length);
        const pt = peiOutline[idx % peiOutline.length];
        points.push({ x: pt.x * scale, y: pt.y * scale });
      }
      return points;
    }

    // 摩羯座（山羊鱼，S形结合几何形）
    function getCapricornShape(scale = 1) {
      const points = [];
      for (let t = 0; t < Math.PI * 2; t += Math.PI * 2 / 200) {
        // 摩羯座形状：S形 + 圆圈
        const x = Math.sin(t) * 6 + Math.sin(t * 2) * 3;
        const y = (t / Math.PI - 1) * 12 + Math.cos(t * 3) * 2;
        points.push({ x: x * scale, y: y * scale });
      }
      return points;
    }

    // ==================== 粒子系统 ====================

    let particles = [];
    let currentShape = 0; // 0=heart, 1=pei, 2=capricorn
    const shapes = [getHeartShape, getPeiShape, getCapricornShape];
    const shapeNames = ['心', '裴字', '摩羯座'];

    class Particle {
      constructor(x, y, targetX, targetY) {
        this.x = x;
        this.y = y;
        this.targetX = targetX;
        this.targetY = targetY;
        this.vx = 0;
        this.vy = 0;
        this.size = 2.5 + Math.random() * 2;
        this.baseSize = this.size;
        this.opacity = 1;
        this.animating = true;
        this.orbitAngle = Math.random() * Math.PI * 2;
        this.orbitRadius = 0;
        this.orbitSpeed = (Math.random() - 0.5) * 0.08;
      }

      update() {
        if (this.animating) {
          // 向目标位置移动
          const dx = this.targetX - this.x;
          const dy = this.targetY - this.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 2) {
            this.x = this.targetX;
            this.y = this.targetY;
            this.animating = false;
          } else {
            this.vx += dx * 0.08;
            this.vy += dy * 0.08;
            this.vx *= 0.92;
            this.vy *= 0.92;
            this.x += this.vx;
            this.y += this.vy;
          }
        } else {
          // 到达目标后，围绕轨道旋转
          this.orbitAngle += this.orbitSpeed;
          this.orbitRadius = Math.min(this.orbitRadius + 0.3, 35);
          this.x = this.targetX + Math.cos(this.orbitAngle) * this.orbitRadius;
          this.y = this.targetY + Math.sin(this.orbitAngle) * this.orbitRadius;
        }

        this.size = this.baseSize + Math.sin(Date.now() * 0.01 + this.orbitAngle) * 0.8;
        this.opacity = 0.9 + Math.sin(Date.now() * 0.005 + this.orbitAngle) * 0.1;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.fill();
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
      }
    }

    // ==================== 初始化 ====================

    function initParticles() {
      particles = [];
      const centerX = w / 2;
      const centerY = h / 2;
      const shapeFunc = shapes[currentShape];
      const shapePoints = shapeFunc(80); // 缩放因子

      // 创建粒子
      const particleCount = 200;
      for (let i = 0; i < particleCount; i++) {
        const idx = Math.floor(Math.random() * shapePoints.length);
        const shapePt = shapePoints[idx];
        
        // 初始位置：随机分布在屏幕
        const startX = Math.random() * w;
        const startY = Math.random() * h;
        
        const targetX = centerX + shapePt.x;
        const targetY = centerY + shapePt.y;

        particles.push(new Particle(startX, startY, targetX, targetY));
      }
    }

    // ==================== 交互 ====================

    canvas.addEventListener('click', () => {
      currentShape = (currentShape + 1) % 3;
      console.log(`切换到: ${shapeNames[currentShape]}`);
      initParticles();
    });

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      currentShape = (currentShape + 1) % 3;
      initParticles();
    });

    // ==================== 渲染 ====================

    function animate() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      for (const particle of particles) {
        particle.update();
        particle.draw();
      }

      ctx.shadowBlur = 0;
      requestAnimationFrame(animate);
    }

    initParticles();
    animate();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Silver Heart</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }

    body {
      background: #000000;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000000;
      cursor: default;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');

    let w = 0, h = 0, dpr = 1;
    let points = [];
    let haloPoints = [];

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function heartCurve(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3) * scale;
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
      return { x, y };
    }

    function buildPoints() {
      points = [];
      haloPoints = [];

      const cx = w * 0.72;
      const cy = h * 0.54;
      const scale = Math.min(w, h) * 0.18;

      const count = 260;
      for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 2 + rand(-0.15, 0.15);
        const base = heartCurve(t, scale * (0.88 + rand(0, 0.32)));
        const jitter = rand(-1.6, 1.6);
        const r = rand(1.2, 3.1);
        const alpha = rand(0.45, 1);
        points.push({
          x: cx + base.x + jitter,
          y: cy + base.y + jitter * 0.8,
          r,
          alpha,
          phase: rand(0, Math.PI * 2),
          pulse: rand(0.8, 1.3)
        });
      }

      // airy dots around the heart to mimic the floating sparkling look
      const dustCount = 90;
      for (let i = 0; i < dustCount; i++) {
        const angle = rand(0, Math.PI * 2);
        const radius = rand(18, 220);
        const x = cx + Math.cos(angle) * radius + rand(-22, 22);
        const y = cy + Math.sin(angle) * radius * 0.7 + rand(-24, 24);
        haloPoints.push({
          x,
          y,
          r: rand(0.8, 2.2),
          alpha: rand(0.2, 0.8),
          phase: rand(0, Math.PI * 2)
        });
      }
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildPoints();
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      const t = performance.now() * 0.0015;

      for (const p of haloPoints) {
        const a = p.alpha * (0.72 + Math.sin(t * 2.4 + p.phase) * 0.18);
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(255,255,255,0.5)';
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const p of points) {
        const pulse = p.pulse + Math.sin(t * 2.6 + p.phase) * 0.22;
        const r = p.r * pulse;
        const a = p.alpha * (0.8 + Math.sin(t * 3 + p.phase) * 0.2);

        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(255,255,255,0.8)';
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize, { passive: true });
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>

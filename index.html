<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Silver Heart</title>
  <style>
    :root {
      --bg: #000000;
      --dot: #f3f7ff;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: var(--bg);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');

    let w = 0, h = 0, dpr = 1;
    let particles = [];
    let dust = [];

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function heartFormula(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3) * scale;
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
      return { x, y };
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildScene();
    }

    function buildScene() {
      particles = [];
      dust = [];

      const cx = w * 0.72;
      const cy = h * 0.55;
      const scale = Math.min(w, h) * 0.18;

      const heartCount = 240;
      for (let i = 0; i < heartCount; i++) {
        const t = (i / heartCount) * Math.PI * 2 + Math.random() * 0.2;
        const p = heartFormula(t, scale * (0.82 + Math.random() * 0.5));

        particles.push({
          x: cx + p.x + rand(-2.5, 2.5),
          y: cy + p.y + rand(-2.5, 2.5),
          r: rand(1.2, 3.0),
          alpha: rand(0.5, 1),
          phase: rand(0, Math.PI * 2),
          drift: rand(0.2, 1.2),
          offsetX: rand(-10, 10),
          offsetY: rand(-10, 10)
        });
      }

      // extra airy particles around the heart to match the reference screenshot composition
      const dustCount = 90;
      for (let i = 0; i < dustCount; i++) {
        const ang = rand(0, Math.PI * 2);
        const rad = rand(25, 220);
        dust.push({
          x: cx + Math.cos(ang) * rad + rand(-24, 24),
          y: cy + Math.sin(ang) * rad * 0.6 + rand(-30, 30),
          r: rand(0.8, 2.1),
          alpha: rand(0.2, 0.8),
          phase: rand(0, Math.PI * 2),
          drift: rand(0.4, 1.4)
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      const t = performance.now() * 0.001;

      for (const p of dust) {
        const pulse = 0.7 + Math.sin(t * 1.7 + p.phase) * 0.4;
        const r = p.r * pulse;
        const alpha = Math.min(1, Math.max(0.12, p.alpha * (0.75 + Math.sin(t * 2.6 + p.phase) * 0.25)));

        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(255,255,255,0.65)';
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const p of particles) {
        const swayX = Math.sin(t * 1.4 + p.phase) * p.offsetX * 0.08;
        const swayY = Math.cos(t * 1.1 + p.phase) * p.offsetY * 0.08;
        const x = p.x + swayX;
        const y = p.y + swayY;
        const pulse = 0.8 + Math.sin(t * 2.4 + p.phase) * 0.35;
        const r = p.r * pulse;
        const alpha = Math.min(1, Math.max(0.2, p.alpha * (0.9 + Math.sin(t * 2.8 + p.phase) * 0.2)));

        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(255,255,255,0.9)';
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize, { passive: true });
    canvas.addEventListener('pointerdown', () => {
      buildScene();
    }, { passive: true });

    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>

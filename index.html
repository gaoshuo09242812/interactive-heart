<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#09051b" />
  <meta name="description" content="一个可以点击、触摸、拖动互动的动态爱心网页" />
  <title>给你的心动宇宙</title>
  <style>
    :root { --pink:#ff4d9d; --purple:#9d6bff; --cyan:#57e5ff; --glass:rgba(255,255,255,.1); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; color:#fff; background:#09051b; }
    body { position:relative; min-height:100svh; isolation:isolate; }
    body::before { content:""; position:absolute; inset:-20%; z-index:-3; background:radial-gradient(circle at 25% 20%,#51218b 0,transparent 35%),radial-gradient(circle at 80% 80%,#781749 0,transparent 38%),linear-gradient(135deg,#09051b,#160a35 55%,#09051b); animation:bg 16s ease-in-out infinite alternate; }
    @keyframes bg { to { transform:scale(1.15) rotate(4deg); filter:hue-rotate(25deg); } }
    canvas { position:absolute; inset:0; width:100%; height:100%; z-index:-1; }
    .wrap { min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 18px calc(24px + env(safe-area-inset-bottom)); text-align:center; }
    .eyebrow { font-size:clamp(11px,2.5vw,14px); letter-spacing:.35em; opacity:.7; text-transform:uppercase; margin-bottom:10px; }
    h1 { margin:0 0 8px; font-size:clamp(29px,8vw,62px); line-height:1.05; letter-spacing:.04em; text-shadow:0 0 22px rgba(255,77,157,.65); }
    .subtitle { margin:0 0 20px; color:rgba(255,255,255,.78); font-size:clamp(13px,3.5vw,17px); }
    .heart-stage { position:relative; width:min(76vw,330px); aspect-ratio:1; display:grid; place-items:center; cursor:pointer; touch-action:none; }
    .heart-stage::before,.heart-stage::after { content:""; position:absolute; border-radius:50%; border:1px solid rgba(255,145,205,.22); inset:7%; animation:orbit 7s linear infinite; }
    .heart-stage::after { inset:-4%; border-color:rgba(87,229,255,.18); animation-duration:11s; animation-direction:reverse; }
    @keyframes orbit { to { transform:rotate(360deg); } }
    .heart { width:47%; aspect-ratio:1; position:relative; transform:rotate(-45deg); background:linear-gradient(135deg,#ffb5dd 0%,#ff4d9d 38%,#cc2cdd 70%,#714dff 100%); filter:drop-shadow(0 0 25px #ff4d9d) drop-shadow(0 0 65px rgba(184,63,255,.65)); animation:beat 1.15s ease-in-out infinite; transition:filter .3s, transform .3s; }
    .heart::before,.heart::after { content:""; position:absolute; width:100%; height:100%; border-radius:50%; background:inherit; }
    .heart::before { top:-50%; left:0; } .heart::after { left:50%; top:0; }
    .heart-stage:active .heart { filter:drop-shadow(0 0 35px #fff) drop-shadow(0 0 90px #ff4d9d); }
    @keyframes beat { 0%,100% { transform:rotate(-45deg) scale(1); } 15% { transform:rotate(-45deg) scale(1.12); } 30% { transform:rotate(-45deg) scale(1); } 45% { transform:rotate(-45deg) scale(1.06); } }
    .shine { position:absolute; z-index:2; width:18%; aspect-ratio:1; top:22%; left:28%; border-radius:50%; background:#fff; opacity:.8; filter:blur(4px); }
    .message { margin-top:24px; min-height:30px; font-size:clamp(14px,4vw,18px); font-weight:600; color:#ffe3f3; text-shadow:0 0 15px #ff4d9d; }
    .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:16px; max-width:550px; }
    button { border:1px solid rgba(255,255,255,.25); color:#fff; background:var(--glass); backdrop-filter:blur(14px); padding:11px 15px; border-radius:999px; font:inherit; font-size:13px; cursor:pointer; transition:.25s; box-shadow:0 5px 20px rgba(0,0,0,.2); }
    button:hover,button:focus-visible { background:rgba(255,255,255,.2); border-color:rgba(255,255,255,.65); transform:translateY(-2px); outline:none; }
    .hint { margin-top:15px; font-size:12px; opacity:.52; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); opacity:0; pointer-events:none; padding:10px 15px; border-radius:999px; background:rgba(12,7,30,.78); border:1px solid rgba(255,255,255,.2); backdrop-filter:blur(12px); font-size:13px; transition:.35s; white-space:nowrap; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; } }
  </style>
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>
  <main class="wrap">
    <div class="eyebrow">A little universe of love</div>
    <h1>给你的心动宇宙</h1>
    <p class="subtitle">每一次点击，都是一颗为你闪烁的星</p>
    <div class="heart-stage" id="heartStage" role="button" tabindex="0" aria-label="点击爱心制造心形烟花">
      <div class="heart"><i class="shine"></i></div>
    </div>
    <div class="message" id="message">点击爱心，收集一份心动 ✨</div>
    <div class="controls">
      <button id="burst">💖 心动爆发</button>
      <button id="magic">🌈 变换氛围</button>
      <button id="share">🔗 分享给喜欢的人</button>
    </div>
    <div class="hint">手机触摸 / 电脑鼠标都可以互动 · 拖动屏幕留下星光</div>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    const canvas=document.getElementById('space'),ctx=canvas.getContext('2d');
    let W,H,dpr,particles=[],stars=[],hue=330,last=0,drag=false;
    const messages=['你是我宇宙里最亮的星 ✨','今天也要被温柔包围呀 🌷','心动不是偶然，是遇见你 💫','愿所有美好都奔向你 💕','这一颗心，只为你跳动 💗'];
    const resize=()=>{dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(130,Math.floor(W*H/6500))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.25,a:Math.random(),s:Math.random()*.015+.004}));};
    addEventListener('resize',resize,{passive:true});resize();
    function heartPoint(x,y,size,life=1){ particles.push({x,y,vx:(Math.random()-.5)*2.4,vy:(Math.random()-.5)*2.4-1.4,size,life,max:life,hue:hue+Math.random()*35-18,rot:Math.random()*6.28}); }
    function burst(x=W/2,y=H/2){for(let i=0;i<48;i++){let t=Math.random()*Math.PI*2,r=Math.random()*90+20;heartPoint(x+Math.cos(t)*r,y+Math.sin(t)*r,Math.random()*4+2,1.4+Math.random());}for(let i=0;i<26;i++){let t=Math.random()*Math.PI*2,r=Math.random()*150;heartPoint(x+Math.cos(t)*r,y+Math.sin(t)*r,Math.random()*2+1,1.8);}}
    function drawHeart(x,y,s,rot,alpha,color){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=alpha;ctx.fillStyle=`hsl(${color},100%,72%)`;ctx.shadowBlur=12;ctx.shadowColor=`hsl(${color},100%,65%)`;ctx.beginPath();ctx.moveTo(0,s*.3);ctx.bezierCurveTo(-s*1.4,-s*.55,-s*.9,-s*1.55,0,-s*.82);ctx.bezierCurveTo(s*.9,-s*1.55,s*1.4,-s*.55,0,s*.3);ctx.fill();ctx.restore();}
    function frame(t){let dt=Math.min(32,t-last||16);last=t;ctx.clearRect(0,0,W,H);stars.forEach(s=>{s.a+=s.s;if(s.a>1||s.a<.15)s.s*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();});particles=particles.filter(p=>p.life>0);particles.forEach(p=>{p.life-=dt/1000;p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vy+=.018*dt;p.vx*=.995;drawHeart(p.x,p.y,p.size,p.rot,p.life/p.max,p.hue);});ctx.globalAlpha=1;requestAnimationFrame(frame);}requestAnimationFrame(frame);
    function interact(x,y){for(let i=0;i<9;i++)heartPoint(x+(Math.random()-.5)*28,y+(Math.random()-.5)*28,Math.random()*3+1.5,1.1);document.getElementById('message').textContent=messages[Math.floor(Math.random()*messages.length)];}
    const stage=document.getElementById('heartStage');stage.addEventListener('pointerdown',e=>{drag=true;stage.setPointerCapture(e.pointerId);interact(e.clientX,e.clientY);});stage.addEventListener('pointermove',e=>{if(drag)interact(e.clientX,e.clientY);});stage.addEventListener('pointerup',()=>drag=false);stage.addEventListener('pointercancel',()=>drag=false);stage.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();burst();}});
    document.getElementById('burst').onclick=()=>{burst();document.getElementById('message').textContent='砰！满屏都是对你的喜欢 💞';};
    document.getElementById('magic').onclick=()=>{hue=(hue+55)%360;document.documentElement.style.setProperty('--pink',`hsl(${hue},100%,65%)`);document.body.style.filter=`hue-rotate(${Math.round(Math.random()*80-40)}deg)`;showToast('氛围已切换 ✨');};
    document.getElementById('share').onclick=async()=>{const data={title:'给你的心动宇宙',text:'送你一颗会发光的心 💖',url:location.href};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);showToast('链接已复制，发给喜欢的人吧 💌');}}catch(e){}};
    function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}setTimeout(()=>burst(W/2,H/2),500);
  </script>
</body>
</html>

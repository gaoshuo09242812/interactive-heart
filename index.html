<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Silver Heart</title>
  <style>
    :root { --bg: #000; --dot: #f7f9ff; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: var(--bg);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <script>
    const canvas = document.getElementById('scene');
    const ctx = canvas.getContext('2d');

    let w = 0, h = 0, dpr = 1;
    let particles = [];
    let lastTime = 0;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildParticles();
    }

    function heartPoint(t, scale = 1) {
      const x = 16 * Math.pow(Math.sin(t), 3) * scale;
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
      return { x, y };
    }

    function buildParticles() {
      particles = [];
      const count = 280;
      const baseX = w * 0.74;
      const baseY = h * 0.56;
      const scale = Math.min(w, h) * 0.18;

      for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 2 + Math.random() * 0.14;
        const p = heartPoint(t, scale);

        particles.push({
          x: baseX + p.x + (Math.random() - 0.5) * 2,
          y: baseY + p.y + (Math.random() - 0.5) * 2,
          r: Math.random() * 2.3 + 1.2,
          a: Math.random() * 0.9 + 0.1,
          phase: Math.random() * Math.PI * 2,
          drift: Math.random() * 0.7 + 0.2,
          twinkle: Math.random() * 1000,
          offset: Math.random() * 20
        });
      }

      // extra floating particles above/right to simulate the reference image
      for (let i = 0; i < 48; i++) {
        const ang = Math.random() * (Math.PI * 0.65) + Math.PI * 0.2;
        const rad = rand(8, 220);
        particles.push({
          x: baseX + Math.cos(ang) * rad + (Math.random() - 0.5) * 26,
          y: baseY - 110 + Math.sin(ang) * rad + (Math.random() - 0.5) * 18,
          r: Math.random() * 2.2 + 1.0,
          a: Math.random() * 0.8 + 0.2,
          phase: Math.random() * Math.PI * 2,
          drift: Math.random() * 0.8 + 0.3,
          twinkle: Math.random() * 1300,
          offset: Math.random() * 12
        });
      }
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);

      const t = performance.now() * 0.001;

      for (const p of particles) {
        const pulse = 0.7 + Math.sin(t * 2.2 + p.phase) * 0.3;
        const size = p.r * pulse;
        const alpha = Math.min(1, Math.max(0.15, p.a * (0.8 + Math.sin(t * 3 + p.phase) * 0.25)));

        ctx.beginPath();
        ctx.fillStyle = `rgba(247,249,255,${alpha})`;
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(255,255,255,0.8)';
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize, { passive: true });
    canvas.addEventListener('pointerdown', () => {
      buildParticles();
    }, { passive: true });

    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
